# Порты намеренно публикуются ТОЛЬКО на 127.0.0.1.
#
# Docker пишет свои правила в цепочку DOCKER таблицы nat — то есть в обход
# ufw, который фильтрует INPUT. Публикация "5432:5432" открывает Postgres
# всему интернету даже при активном ufw, разрешающем только 22/80/443
# (проверено живым коннектом снаружи — см. AUDIT.md, C-1/C-3).
#
# api не нужен снаружи напрямую: наружу смотрит Caddy на 443, он ходит на
# localhost:8000. db не нужна снаружи вообще — api/bot ходят к ней по
# внутренней docker-сети (db:5432).
#
# Логи ротируются: без max-size json-file растёт безлимитно, а SQL-эхо и
# httpx уже забивали его мусором (см. AUDIT.md, C-5).

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: postgres
      # Пароль — из .env (в git не попадает). Дефолт нужен только для
      # локальной разработки без .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: lifeos
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - lifeos_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    environment:
      database_url: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/lifeos
      TZ: Europe/Moscow
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Хеш развёрнутого коммита — пишется scripts/deploy.sh, отдаётся в
      # /health, чтобы сверять прод с гитом одним curl (см. app/api/health.py).
      - ./DEPLOYED_COMMIT:/app/DEPLOYED_COMMIT:ro
    depends_on:
      db:
        condition: service_healthy

  bot:
    build: .
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    environment:
      database_url: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/lifeos
      TZ: Europe/Moscow
    command: ["python", "-m", "app.telegram.runner"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Google Drive OAuth-токен (Фаза 2 Media Inbox, см.
      # specs/010-media-inbox.md) — только чтение, получен локально через
      # scripts/drive_auth.py, в git не попадает (.gitignore). Файла нет
      # на хосте — контейнер стартует нормально, Media Inbox просто
      # выключен (app/drive/client.py::get_drive_client).
      - ./token.json:/app/token.json:ro
      # Дампы БД (см. scripts/backup_db.sh): pg_dump кладёт файл на хост,
      # контейнер бота забирает его отсюда и выгружает на Drive — токен
      # Диска есть только здесь. :ro — контейнеру достаточно читать.
      - ./backups:/app/backups:ro

volumes:
  lifeos_db_data:
