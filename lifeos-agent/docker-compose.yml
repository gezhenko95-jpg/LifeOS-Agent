services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lifeos
    ports:
      - "5432:5432"
    volumes:
      - lifeos_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      database_url: postgresql+asyncpg://postgres:postgres@db:5432/lifeos
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      database_url: postgresql+asyncpg://postgres:postgres@db:5432/lifeos
    command: ["python", "-m", "app.telegram.runner"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  lifeos_db_data:
